name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: new Symfony and PHP releases can break compatibility without a push

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }}${{ matrix.dbal && ' · DBAL 3' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "7.4", symfony: "5.4.*" }
          - { php: "8.0", symfony: "5.4.*" }
          - { php: "8.1", symfony: "5.4.*" }
          - { php: "8.2", symfony: "6.4.*" }
          - { php: "8.2", symfony: "6.4.*", dbal: "^3.3" }
          - { php: "8.3", symfony: "^7.0" }
          - { php: "8.4", symfony: "^7.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install Symfony ${{ matrix.symfony }}
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1 # old component releases carry advisories: allowed for tests only
        # Every component of the same release, or Composer mixes in newer ones (Messenger 7 with HttpKernel 6.4).
        run: |
          with=""
          for c in framework-bundle http-kernel http-foundation dependency-injection config \
                   event-dispatcher routing console messenger twig-bundle yaml; do
            with="$with --with symfony/$c:${{ matrix.symfony }}"
          done
          if [ -n "${{ matrix.dbal }}" ]; then with="$with --with doctrine/dbal:${{ matrix.dbal }}"; fi
          composer update --no-interaction --no-progress $with
      - run: vendor/bin/phpunit
