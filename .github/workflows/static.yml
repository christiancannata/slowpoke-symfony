name: static analysis

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan level 6 · composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "7.4" # the minimum the bundle declares: a signature is only safe if it is safe there
          coverage: none
          tools: composer:v2, phpstan:2
      - name: Install the minimum supported set (Symfony 5.4, DBAL 3)
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          with=""
          for c in framework-bundle http-kernel http-foundation dependency-injection config \
                   event-dispatcher routing console messenger twig-bundle yaml; do
            with="$with --with symfony/$c:5.4.*"
          done
          composer update --no-interaction --no-progress $with
      - name: Static analysis
        run: phpstan analyse --no-progress
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction
